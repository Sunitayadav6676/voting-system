<html lang="en">
<head>

<body>
<!--internal css-->

    <div id="headersection">

    <div id="bodysection">
    <h3>Registration</h3>
    <form action="../api/register.php" method="POST">
        <input type="text" name="name" placeholder="Enter your name">
        <input type="number" name="mobile" placeholder="Enter your number"><br><br>
        <input type="password" name="password" placeholder="Enter your password">

        <input id="address" type="text" name="address" placeholder="Enter your address"><br><br>

            <div id="imagepart">
                 Upload image: <input type="file" name="photo" >
            </div><br>
    
        <div id="role">
            Select role<select name="role"><br>
            <option value="1">Voter</option>
            <option value="2">Group</option>
            </select>
    
       </div>
    </center>
    <br>
        <button style="padding:10px;
        border-radius: 5px;
        background-color: rgb(0, 157, 255);
        color: white;
        border-radius: 5px;">Regiater</button>
      <br><br>
       Already user? <a href="../index.html">Login here</a>
    </form>
